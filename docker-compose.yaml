name: concierge

# Two deployables over the shared `llm-network` docker network (which
# provides the `ollama` container — this project runs no models of its own):
#
#   chatbot-concierge  public side — LangGraph query workflow + embeddable
#                      widget + chat page + audit log. Query-only: it never
#                      crawls or re-indexes, so the deployed corpus can't be
#                      modified by visitors.
#   extractor          admin side (profile `admin`, NOT public) — admin UI
#                      to crawl a site into a corpus, screenshot the
#                      homepage, extract facts, style the widget, and grab
#                      the embed tag. Brings the whole firecrawl pipeline.
#
# The corpus is the handoff: extractor writes the `corpora` table (SQLite,
# langgraph.db in the ./data bind mount); concierge reads it.
#
#   docker compose up -d                    # public side only
#   docker compose --profile admin up -d    # everything incl. admin stack
#
# Prereqs: `llm-network` must exist with a running `ollama` container AND
# the shared `firecrawl` (+`firecrawl-playwright`) containers — this project
# runs none of them itself; extractor reaches them over the network gateway
# (http://firecrawl:3002). Models named in .env must already be pulled:
#   docker exec ollama ollama pull llama3.1:8b
#   docker exec ollama ollama pull nomic-embed-text

services:
  # ------------------------------------------------------------- chatbot-concierge
  # LangGraph orchestration layer — one deterministic, checkpointed graph:
  #   POST /query: load corpus -> retrieve -> answer -> verify (loop)
  # The corpus (corpora table, SQLite in ./data/langgraph.db) is written
  # by the `extractor` service — this service only reads it.
  # Poll GET /runs/{id} to watch node-by-node progression; chat page at /.
  chatbot-concierge:
    container_name: concierge
    build:
      context: .
      dockerfile: infra/Dockerfile.chatbot-concierge
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL}
      # Shared qdrant (rag stack) on llm-network — corpus vectors live here.
      QDRANT_URL: ${QDRANT_URL}
      CHATBOT_CONCIERGE_DB_PATH: /data/langgraph.db
      TZ: ${CONCIERGE_TZ}
    networks:
      - llm-network
    volumes:
      - ./data:/data
    ports:
      - "${CHATBOT_CONCIERGE_PORT}:8080"
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  # -------------------------------------------- cloudflare tunnel
  # Publishes concierge:8080 on a stable public hostname — a named
  # Cloudflare Tunnel (Zero Trust dashboard → Networks → Tunnels). Set
  # CF_TUNNEL_TOKEN in .env; the dashboard maps the hostname to this
  # container, which forwards to concierge:8080.
  tunnel:
    container_name: concierge-tunnel
    image: cloudflare/cloudflared:2026.10.7
    networks:
      - llm-network
    depends_on:
      chatbot-concierge:
        condition: service_healthy
    environment:
      # cloudflared reads TUNNEL_TOKEN natively — set CF_TUNNEL_TOKEN in
      # .env and the named tunnel just runs. Until then the container
      # exits with a clear "token required" error, which is expected.
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN}
    command: tunnel --no-autoupdate run
    # No restart loop — without CF_TUNNEL_TOKEN it exits once with a clear
    # error instead of spamming logs; it runs properly once the token's set.

  # ---------------------------------------------------------------- extractor
  # Admin corpus-builder + admin UI — the `admin` profile keeps it out of
  # public deploys. Index graph (crawl->chunk->embed->store) writes
  # corpora to the same ./data bind mount concierge reads.
  extractor:
    container_name: concierge-extractor
    profiles: ["admin"]
    build:
      context: .
      dockerfile: infra/Dockerfile.extractor
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL}
      # Shared firecrawl container (local-ai-stack) on llm-network — its
      # own playwright backend renders JS-heavy pages; nothing to run here.
      FIRECRAWL_URL: http://firecrawl:3002
      SCREENSHOT_URL: http://screenshotter:3000
      # Public concierge URL baked into embed tags — set once at deploy.
      PUBLIC_CHATBOT_URL: ${PUBLIC_CHATBOT_URL}
      QDRANT_URL: ${QDRANT_URL}
      DB_PATH: /data/langgraph.db
      TZ: ${CONCIERGE_TZ}
    networks:
      - llm-network
    volumes:
      - ./data:/data
    depends_on:
      screenshotter:
        condition: service_started
    ports:
      - "127.0.0.1:${EXTRACTOR_PORT}:8080"
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  # ------------------------------------------------------- screenshotter
  # Homepage PNG capture for the admin UI — the shared playwright-service
  # only serves /scrape (HTML), so this tiny node server runs on the same
  # already-pulled image. Admin profile only; never published.
  screenshotter:
    container_name: concierge-screenshotter
    profiles: ["admin"]
    image: ghcr.io/firecrawl/playwright-service:latest
    working_dir: /usr/src/app
    command: ["node", "shot-server.js"]
    volumes:
      - ./infra/shot-server.js:/usr/src/app/shot-server.js:ro
    networks:
      - llm-network
    tmpfs:
      - /tmp
    restart: unless-stopped

  # ------------------------------------------------------------------- e2e
  # On-demand containerized test runner — zero host tooling needed:
  #   docker compose --profile test run --rm e2e
  e2e:
    container_name: concierge-e2e
    image: mcr.microsoft.com/playwright:v1.64.0-noble
    profiles: ["test"]
    working_dir: /work
    volumes:
      - ./tests:/work
    networks:
      - llm-network
    environment:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      OLLAMA_URL: http://ollama:11434
      CHATBOT_CONCIERGE_URL: http://chatbot-concierge:8080
    depends_on:
      chatbot-concierge:
        condition: service_healthy
    command: sh -c "npm install --no-audit --no-fund --silent && npx playwright test"

networks:
  llm-network:
    external: true
